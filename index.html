<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Google Analytics Snippet -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script> 
    <script> 
      window.dataLayer = window.dataLayer || []; 
      function gtag(){dataLayer.push(arguments);} 
      gtag('js', new Date()); 
      gtag('config', 'G-XXXXXXXXXX'); 
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Bike Rental - Booking System</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3721/3721619.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 120px; }
        .hero { background: #2d3436; color: white; padding: 65px 0; text-align: center; margin-bottom: 30px; }
        .card-motor { border: none; border-radius: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.06); transition: 0.3s; overflow: hidden; background: #fff; }
        .card-motor:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
        .search-box { background: white; padding: 30px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: -85px; }
        .btn-search { background-color: #2d3436; border: none; padding: 12px; color: white; font-weight: bold; }
        .btn-search:hover { background-color: #000; }
        .img-wrapper { position: relative; height: 230px; overflow: hidden; background: #eaedf0; display: flex; align-items: center; justify-content: center; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .available-badge { position: absolute; top: 15px; left: 15px; font-size: 0.8rem; font-weight: bold; letter-spacing: 0.5px; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        /* Selector Quantity Styling */
        .qty-controls { display: flex; align-items: center; justify-content: center; gap: 15px; background: #f8f9fa; border-radius: 12px; padding: 10px; }
        .btn-qty { width: 35px; height: 35px; border-radius: 50%; border: none; background: #2d3436; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-qty:hover { background: #000; }
        .btn-qty:disabled { background: #ced4da; cursor: not-allowed; }
        
        /* Sticky Checkout Banner */
        .selection-banner {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(45, 52, 54, 0.98); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 20px 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.15); z-index: 2000;
            border-radius: 20px 20px 0 0; display: none; color: white;
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="container">
        <h1 class="display-5 fw-bold" id="brandTitle">Bike Rental System</h1>
        <p class="lead opacity-75">SaaS PWA Multi-Unit Booking System</p>
    </div>
</div>

<div class="container">
    <!-- Search Form -->
    <div class="search-box mb-5">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label fw-bold text-secondary">Pick-up Date</label>
                <input type="date" id="start" class="form-control form-control-lg">
            </div>
            <div class="col-md-5">
                <label class="form-label fw-bold text-secondary">Return Date</label>
                <input type="date" id="end" class="form-control form-control-lg">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button onclick="handleFilter()" class="btn btn-search w-100 btn-lg rounded-3">Search Availability</button>
            </div>
        </div>
    </div>

    <!-- Status Loading -->
    <div id="loading" class="text-center py-5" style="display: none;">
        <div class="spinner-border text-dark" role="status"></div>
        <p class="mt-2 text-muted fw-bold">Connecting database...</p>
    </div>

    <!-- Placeholder Status Awal -->
    <div id="placeholder" class="text-center py-5">
        <h3 class="text-secondary fw-normal">Please select dates to check available fleets.</h3>
    </div>

    <!-- Container Grid Motor -->
    <div class="row" id="motorContainer"></div>
</div>

<!-- Sticky Checkout Banner (Multi-Unit) -->
<div id="selectionBanner" class="selection-banner">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-8 col-md-9">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                        <i class="fas fa-shopping-basket fs-5"></i>
                    </div>
                    <div>
                        <h5 class="m-0 fw-bold" id="lblBannerCount">0 Unit(s) Selected</h5>
                        <small class="text-white-50 text-truncate d-block" id="lblBannerSummary" style="max-width: 500px;"></small>
                    </div>
                </div>
            </div>
            <div class="col-4 col-md-3 text-end">
                <button onclick="proceedToBookingForm()" class="btn btn-warning fw-bold btn-lg w-100 py-3 rounded-3 shadow">
                    CONTINUE <i class="fas fa-chevron-right ms-2"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const clientToken = params.get('token') || 'mrd';
    
    // API URL mengarah ke doGet Master Registry
    const API_URL = `https://script.google.com/macros/s/AKfycbxdnEun8-kSEK_9c0j8kQXMD6VNU8q_D-xGV-33dQ8SM6uuLZiGjDewh-RNPWq4YBHk/exec?token=${clientToken}`;

    let motors = [];
    let bookings = [];
    let isDataLoaded = false;

    let selectedQty = {};      
    let availablePlates = {};   
    let groupMetaData = {};     

    document.getElementById('brandTitle').innerText = `${clientToken.charAt(0).toUpperCase() + clientToken.slice(1)} Rental`;

    function getFallbackImage(type) {
        const t = type.toLowerCase();
        if (t.includes("nmax")) return "https://i.ibb.co.com/1JzVD8KB/NMAX-NEO-S-BLACK.png";
        if (t.includes("vespa")) return "https://i.ibb.co.com/WpjDP07V/harga-vespa-matic-2023-1.webp";
        if (t.includes("scoopy")) return "https://www.wahanahonda.com/assets/upload/produk/gambar/PRODUK_GAMBAR_48_2025-11-13.webp";
        if (t.includes("vario")) return "https://i.ibb.co.com/9kbm6Pwh/images-15.jpg";
        if (t.includes("beat")) return "https://i.ibb.co.com/BHDpWZXS/honda-beat-deluxe-smart-key-deluxe-matte-blue-01-warna.webp";
        if (t.includes("fazzio")) return "https://i.ibb.co.com/nqgDF9kV/images-11.jpg";
        if (t.includes("stylo")) return "https://i.ibb.co.com/ycFPFg1k/008881800-1706860240-20240202-144627.jpg";
        if (t.includes("filano")) return "https://cdn.antaranews.com/cache/1200x800/2024/11/07/1000446916.jpg";
        return "https://i.ibb.co.com/WpjDP07V/harga-vespa-matic-2023-1.webp";
    }

    async function fetchData() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            motors = data.items || [];
            bookings = data.bookings || [];
            isDataLoaded = true;
        } catch (error) { 
            console.error("Gagal menarik data API:", error); 
        }
    }

    // Pembersihan spasi nomor polisi DK agar pencocokan presisi
    function cleanPlate(plate) {
        return String(plate).trim().replace(/\s/g, '').toLowerCase();
    }

    function isOccupied(plate, startReq, endReq) {
        const sReq = new Date(startReq);
        const eReq = new Date(endReq);
        const cleanedTargetPlate = cleanPlate(plate);

        return bookings.some(b => {
            if (cleanPlate(b.no_motor) !== cleanedTargetPlate) return false;
            
            const st = b.status ? b.status.toLowerCase() : "";
            if (st === "cancel" || st === "done") return false;

            const bStart = new Date(b.start);
            const bEnd = new Date(b.end);

            if (isNaN(bStart.getTime()) || isNaN(bEnd.getTime())) return false;

            return (sReq < bEnd && eReq > bStart);
        });
    }

    function renderList(sDate, eDate) {
        const container = document.getElementById('motorContainer');
        container.innerHTML = "";
        
        availablePlates = {};
        groupMetaData = {};
        
        let totalAvailable = 0;

        motors.forEach(m => {
            const plate = m[0], type = m[1], brand = m[2], price = m[3], customImg = m[4], status = m[5];
            
            // Filter unit rusak/dalam perbaikan atau sedang tersewa di tanggal pilihan
            const clnStatus = status.toLowerCase();
            if (clnStatus === "bengkel" || clnStatus === "servis" || clnStatus === "rusak" || isOccupied(plate, sDate, eDate)) return;
            
            totalAvailable++;
            const groupKey = `${brand.replace(/\s+/g, '_')}_${type.replace(/\s+/g, '_')}`;
            
            if (!availablePlates[groupKey]) {
                availablePlates[groupKey] = [];
                groupMetaData[groupKey] = {
                    brand: brand,
                    type: type,
                    price: price,
                    image: customImg ? customImg : getFallbackImage(type)
                };
            }
            availablePlates[groupKey].push(plate);
        });

        if (totalAvailable === 0) {
            container.innerHTML = `<div class="text-center py-5 w-100"><h3>😔 Sorry, we are fully booked for these dates.</h3></div>`;
            return;
        }

        for (const key in availablePlates) {
            const group = groupMetaData[key];
            const maxUnits = availablePlates[key].length;
            const currentQty = selectedQty[key] || 0;

            container.innerHTML += `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card card-motor h-100 border-0 shadow-sm">
                        <div class="img-wrapper">
                            <span class="badge bg-success available-badge rounded-pill">${maxUnits} Unit(s) Available</span>
                            <img src="${group.image}" alt="${group.type}" onerror="this.onerror=null;this.src='${getFallbackImage(group.type)}';">
                        </div>
                        <div class="card-body p-4 text-center">
                            <h4 class="fw-bold text-dark mb-0 text-uppercase">${group.brand}</h4>
                            <h5 class="text-secondary mb-4">${group.type}</h5>
                            <div class="bg-light p-3 rounded mb-4">
                                <span class="d-block text-muted small">Daily Rate</span>
                                <span class="fw-bold fs-4 text-dark">IDR ${Number(group.price).toLocaleString('id-ID')}</span>
                            </div>
                            
                            <div class="qty-controls">
                                <button onclick="adjustQty('${key}', -1)" class="btn-qty" id="btnMin-${key}">-</button>
                                <span class="fw-bold fs-5 px-2" id="qtyVal-${key}">${currentQty}</span>
                                <button onclick="adjustQty('${key}', 1)" class="btn-qty" id="btnPlus-${key}">+</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }
    }

    async function handleFilter() {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        if (!start || !end) { alert("Please select both dates."); return; }
        
        selectedQty = {};
        updateSelectionBanner();

        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('motorContainer').innerHTML = "";
        document.getElementById('loading').style.display = 'block';
        
        if (!isDataLoaded) await fetchData();
        
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            renderList(start, end);
        }, 500);
    }

    function adjustQty(key, delta) {
        const max = availablePlates[key].length;
        let current = selectedQty[key] || 0;
        
        current += delta;
        if (current < 0) current = 0;
        if (current > max) current = max;
        
        selectedQty[key] = current;
        document.getElementById(`qtyVal-${key}`).innerText = current;

        updateSelectionBanner();
    }

    function updateSelectionBanner() {
        let totalSelected = 0;
        let summaryList = [];

        for (const key in selectedQty) {
            const qty = selectedQty[key];
            if (qty > 0) {
                totalSelected += qty;
                const metadata = groupMetaData[key];
                summaryList.push(`${qty}x ${metadata.type}`);
            }
        }

        const banner = document.getElementById('selectionBanner');
        if (totalSelected > 0) {
            banner.style.display = 'block';
            document.getElementById('lblBannerCount').innerText = `${totalSelected} Unit(s) Selected`;
            document.getElementById('lblBannerSummary').innerText = summaryList.join(', ');
        } else {
            banner.style.display = 'none';
        }
    }

    function proceedToBookingForm() {
        let finalPlates = [];
        let finalPrices = [];
        let finalBrands = [];
        let finalTypes = [];

        for (const key in selectedQty) {
            const qty = selectedQty[key];
            if (qty > 0) {
                const plates = availablePlates[key];
                const meta = groupMetaData[key];
                
                for (let i = 0; i < qty; i++) {
                    finalPlates.push(plates[i]);
                    finalPrices.push(meta.price);
                    finalBrands.push(meta.brand);
                    finalTypes.push(meta.type);
                }
            }
        }

        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;

        const urlParams = new URLSearchParams({
            token: clientToken,
            motor: finalPlates.join(','),
            price: finalPrices.join(','),
            brand: finalBrands.join(','),
            type: finalTypes.join(','),
            start: start,
            end: end
        });

        window.location.href = `form.html?${urlParams.toString()}`;
    }

    fetchData();
</script>
</body>
</html>
