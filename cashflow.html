<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard - AMS Pro</title>
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <meta name="theme-color" content="#2d3436">

    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Roboto, sans-serif; padding-top: 20px; padding-bottom: 50px; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #fff; overflow: hidden; }
        .header-box { background: #2d3436; color: white; padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .stat-card { border: none; border-radius: 12px; transition: 0.3s; color: white; }
        .stat-card:hover { transform: translateY(-3px); }
        .bg-income { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .bg-expense { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .bg-profit { background: linear-gradient(135deg, #2980b9, #2c3e50); }
        
        /* EXCEL PIVOT TABLE STYLING */
        .table-pivot { width: 100%; border-collapse: collapse; min-width: 1200px; font-size: 0.85rem; }
        .table-pivot th, .table-pivot td { border: 1px solid #cbd5e1; padding: 8px 12px; vertical-align: middle; white-space: nowrap; }
        
        /* Warna Header ala Excel Suhu */
        .th-unit { background-color: #0000ff !important; color: white; text-align: center; font-weight: bold; }
        .th-masuk { background-color: #4caf50 !important; color: white; text-align: center; font-weight: bold; }
        .th-keluar { background-color: #f44336 !important; color: white; text-align: center; font-weight: bold; }
        .th-laba { background-color: #2c3e50 !important; color: white; text-align: center; font-weight: bold; }
        
        .row-nonunit { background-color: #f8f9fa; font-weight: 600; }
        .row-total { background-color: #e2f0d9; font-weight: 800; font-size: 0.95rem; }
        .text-right { text-align: right !important; }
        
        /* Table Responsive Scrollbar */
        .table-responsive::-webkit-scrollbar { height: 10px; width: 10px; }
        .table-responsive::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-responsive::-webkit-scrollbar-thumb { background: #b2bec3; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container-fluid px-md-4">
    <div class="main-card mb-4">
        <!-- Header -->
        <div class="header-box">
            <div>
                <h3 class="fw-bold m-0" style="letter-spacing: -1px;"><i class="fas fa-wallet me-2 text-warning"></i> CashFlow Analyzer</h3>
                <p class="m-0 opacity-75" style="font-size: 0.85rem;" id="lblSubTitle">Real-time Financial Board</p>
            </div>
            
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <!-- Dropdown Pilihan Unit Motor -->
                <select id="unitFilter" class="form-select form-select-sm bg-light fw-bold" style="width: 140px; cursor: pointer;">
                    <option value="all">ALL UNITS</option>
                </select>
                
                <!-- Tanggal Berjangka -->
                <div class="d-flex align-items-center gap-1 bg-light p-1 rounded-3 border">
                    <input type="date" id="startDate" class="form-control form-control-sm border-0 fw-bold" style="width: 125px; cursor: pointer;">
                    <span class="text-dark-50 fw-bold" style="font-size: 0.8rem;">to</span>
                    <input type="date" id="endDate" class="form-control form-control-sm border-0 fw-bold" style="width: 125px; cursor: pointer;">
                </div>
                
                <button onclick="refreshData()" class="btn btn-warning btn-sm fw-bold ms-2"><i class="fas fa-sync-alt"></i></button>
                <button onclick="exportToExcel()" class="btn btn-success btn-sm fw-bold ms-1" title="Unduh Laporan Excel"><i class="fas fa-file-excel"></i> EXPORT</button>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2 text-muted fw-bold">Calculating matrix...</p>
        </div>

        <div id="dashboardContent" style="display: none;" class="p-3 p-md-4">
            
            <!-- 1. KARTU EXECUTIVE SUMMARY -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="card stat-card bg-income p-4 shadow-sm">
                        <small class="text-white-50 fw-bold uppercase">TOTAL KAS MASUK (GROSS)</small>
                        <h2 class="fw-bold mt-2" id="valKasMasuk">IDR 0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card bg-expense p-4 shadow-sm">
                        <small class="text-white-50 fw-bold uppercase">TOTAL KAS KELUAR (EXPENSES)</small>
                        <h2 class="fw-bold mt-2" id="valKasKeluar">IDR 0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card bg-profit p-4 shadow-sm">
                        <small class="text-white-50 fw-bold uppercase">LABA BERSIH (NET PROFIT)</small>
                        <h2 class="fw-bold mt-2" id="valLabaBersih">IDR 0</h2>
                    </div>
                </div>
            </div>

            <!-- 2. EXCEL PIVOT TABLE (REPORT DETAIL DINAMIS) -->
            <div class="section-title fw-bold text-dark mb-3"><i class="fas fa-table text-primary me-2"></i> Report Detail (Excel View)</div>
            <div class="table-responsive bg-white rounded-3 border shadow-sm pb-2">
                <table class="table-pivot" id="excelPivotTable">
                    <thead id="pivotHeader">
                        <!-- Header akan dirender dinamis -->
                    </thead>
                    <tbody id="pivotBody">
                        <!-- Baris akan dirender dinamis -->
                    </tbody>
                    <tfoot id="pivotFooter">
                        <!-- Total akan dirender dinamis -->
                    </tfoot>
                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const clientToken = params.get('token') || 'mrd';
    
    // GANTI JIKA PERLU DENGAN URL GAS MASTER TERBARU SUHU
    const API_URL = `https://script.google.com/macros/s/AKfycbxdnEun8-kSEK_9c0j8kQXMD6VNU8q_D-xGV-33dQ8SM6uuLZiGjDewh-RNPWq4YBHk/exec?token=${clientToken}`;

    let cashflows = []; 
    let motors = [];

    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const unitFilter = document.getElementById('unitFilter');
    const today = new Date();
    
    window.onload = () => {
        document.getElementById('lblSubTitle').innerText = `Sesi: ${clientToken.toUpperCase()} | Financial Board`;
        
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        
        startDateInput.value = formatDateInput(firstDay);
        endDateInput.value = formatDateInput(lastDay);

        refreshData();
    };

    function formatDateInput(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    startDateInput.addEventListener('change', kalkulasiPivot);
    endDateInput.addEventListener('change', kalkulasiPivot);
    unitFilter.addEventListener('change', kalkulasiPivot);

    async function refreshData() {
        document.getElementById('dashboardContent').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        try {
            const uniqueTime = Date.now(); 
            const fetchUrl = `${API_URL}&t=${uniqueTime}`;
            
            const response = await fetch(fetchUrl);
            const data = await response.json();
            
            if (data.error) {
                alert("❌ Akses Ditolak: " + data.message);
                document.getElementById('loading').style.display = 'none';
                return;
            }

            motors = data.items || [];
            cashflows = data.cashflows || []; 

            // Isi Dropdown Filter
            const filterSelect = document.getElementById('unitFilter');
            filterSelect.innerHTML = `<option value="all">ALL UNITS</option>`;
            motors.forEach(m => {
                const plat = String(m[0]).trim().toUpperCase();
                filterSelect.innerHTML += `<option value="${plat}">${plat} - ${m[1]}</option>`;
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            
            kalkulasiPivot();
        } catch (error) { 
            console.error(error);
            alert("❌ Gagal terhubung ke database.");
            document.getElementById('loading').style.display = 'none';
        }
    }

    // Fungsi Format Rupiah
    function rp(angka) {
        if(angka === 0) return "Rp0";
        return "Rp" + parseInt(angka).toLocaleString('id-ID');
    }

    function parseKeTanggal(val) {
        if (val instanceof Date) return val;
        if (typeof val === "string") {
            const parts = val.trim().split(/\s+/)[0].split(/[-/]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) return new Date(parts[0], parts[1] - 1, parts[2]);
                else return new Date(parts[2], parts[1] - 1, parts[0]);
            }
        }
        return new Date(val);
    }

    /**
     * 🌟 CORE ENGINE: DYNAMIC PIVOT TABLE GENERATOR
     */
    function kalkulasiPivot() {
        const startVal = startDateInput.value;
        const endVal = endDateInput.value;
        if (!startVal || !endVal) return;

        const dStart = new Date(startVal); dStart.setHours(0,0,0,0);
        const dEnd = new Date(endVal); dEnd.setHours(23,59,59,999);
        const selectedUnit = unitFilter.value.toLowerCase().replace(/\s/g, "");

        // 1. FILTER TANGGAL
        const filteredCashFlows = cashflows.filter(cf => {
            const cfDateStr = cf.tanggal ? cf.tanggal.trim() : "";
            if (cfDateStr === "") return true; // Loloskan data tanpa tanggal
            const cfDate = parseKeTanggal(cfDateStr);
            return cfDate >= dStart && cfDate <= dEnd;
        });

        // 2. KUMPULKAN NAMA KATEGORI DINAMIS (HEADER)
        let incomeHeadersSet = new Set();
        let expenseHeadersSet = new Set();
        let hasHppPokok = false;

        filteredCashFlows.forEach(cf => {
            const type = cf.jenis ? cf.jenis.toLowerCase().trim() : "";
            const cat = cf.kategori || "Umum";
            const pokok = parseInt(cf.jumlah_pokok) || 0;

            if (type === "masuk" || cf.pemasukan > 0) incomeHeadersSet.add(cat);
            if (type === "keluar" || cf.pengeluaran > 0) expenseHeadersSet.add(cat);
            if (pokok > 0) hasHppPokok = true;
        });

        let incHeaders = Array.from(incomeHeadersSet).sort();
        let expHeaders = Array.from(expenseHeadersSet).sort();
        
        // Posisikan Jumlah Pokok/HPP di awal pengeluaran jika ada
        if (hasHppPokok) {
            expHeaders = ["Jumlah Pokok", ...expHeaders];
        }

        // 3. INISIALISASI STRUKTUR DATA PER UNIT
        let reportMap = {};
        motors.forEach(m => {
            const platAsli = String(m[0]).toUpperCase();
            const platClean = platAsli.toLowerCase().replace(/\s/g, "");
            reportMap[platClean] = {
                platAsli: platAsli,
                tipe: m[1] || "-",
                totalIn: 0,
                totalOut: 0,
                incomes: {},
                expenses: {}
            };
            incHeaders.forEach(h => reportMap[platClean].incomes[h] = 0);
            expHeaders.forEach(h => reportMap[platClean].expenses[h] = 0);
        });

        // Tambahkan baris khusus untuk pengeluaran umum (Tanpa Plat Nomor)
        reportMap["nonunit"] = { platAsli: "Non Unit", tipe: "-", totalIn: 0, totalOut: 0, incomes: {}, expenses: {} };
        incHeaders.forEach(h => reportMap["nonunit"].incomes[h] = 0);
        expHeaders.forEach(h => reportMap["nonunit"].expenses[h] = 0);

        // 4. DISTRIBUSI ANGKA KE DALAM MATRIX (PIVOTING)
        let grandTotalMasuk = 0;
        let grandTotalKeluar = 0;

        filteredCashFlows.forEach(cf => {
            const motorRaw = cf.motor ? cf.motor.toLowerCase().replace(/\s/g, "") : "";
            const targetPlat = reportMap[motorRaw] ? motorRaw : "nonunit";
            
            // Filter Unit Dropdown
            if (selectedUnit !== "all" && targetPlat !== selectedUnit) return;

            const type = cf.jenis ? cf.jenis.toLowerCase().trim() : "";
            const cat = cf.kategori || "Umum";
            const amount = parseInt(cf.pemasukan || cf.pengeluaran || cf.jumlah || 0);
            const pokok = parseInt(cf.jumlah_pokok || 0);

            // Cabang 1: Pemasukan
            if (type === "masuk" || cf.pemasukan > 0) {
                reportMap[targetPlat].incomes[cat] += amount;
                reportMap[targetPlat].totalIn += amount;
                grandTotalMasuk += amount;
            } 
            // Cabang 2: Pengeluaran
            else if (type === "keluar" || cf.pengeluaran > 0) {
                reportMap[targetPlat].expenses[cat] += amount;
                reportMap[targetPlat].totalOut += amount;
                grandTotalKeluar += amount;
            }

            // Cabang 3: HPP / Jumlah Pokok (Bisa nempel di baris masuk)
            if (pokok > 0) {
                reportMap[targetPlat].expenses["Jumlah Pokok"] += pokok;
                reportMap[targetPlat].totalOut += pokok;
                grandTotalKeluar += pokok;
            }
        });

        // 5. UPDATE EXECUTIVE SUMMARY
        document.getElementById('valKasMasuk').innerText = rp(grandTotalMasuk);
        document.getElementById('valKasKeluar').innerText = rp(grandTotalKeluar);
        document.getElementById('valLabaBersih').innerText = rp(grandTotalMasuk - grandTotalKeluar);

        // ==============================================================
        // 6. RENDER HTML TABLE (MENIRU GAYA EXCEL SUHU)
        // ==============================================================
        const thead = document.getElementById('pivotHeader');
        const tbody = document.getElementById('pivotBody');
        const tfoot = document.getElementById('pivotFooter');
        
        thead.innerHTML = ""; tbody.innerHTML = ""; tfoot.innerHTML = "";

        // --- RENDER HEADER BARIS 1 (Group Title) ---
        let trHead1 = `<tr>
            <th colspan="2" class="th-unit">UNIT MOTOR</th>
            <th colspan="${1 + incHeaders.length}" class="th-masuk">PEMASUKAN</th>
            <th colspan="${1 + expHeaders.length}" class="th-keluar">PENGELUARAN</th>
            <th class="th-laba">HASIL</th>
        </tr>`;

        // --- RENDER HEADER BARIS 2 (Sub Categories) ---
        let trHead2 = `<tr>
            <th class="th-unit">No Unit</th>
            <th class="th-unit">Tipe</th>
            <th class="th-masuk" style="background-color: #388e3c !important;">Total Masuk</th>`;
            
        incHeaders.forEach(h => { trHead2 += `<th class="th-masuk">${h}</th>`; });
        
        trHead2 += `<th class="th-keluar" style="background-color: #d32f2f !important;">Total Keluar</th>`;
        expHeaders.forEach(h => { trHead2 += `<th class="th-keluar">${h}</th>`; });
        
        trHead2 += `<th class="th-laba">Laba Bersih</th></tr>`;
        
        thead.innerHTML = trHead1 + trHead2;

        // --- RENDER ISI BARIS (BODY) ---
        let colTotals = { in: {}, exp: {} };
        incHeaders.forEach(h => colTotals.in[h] = 0);
        expHeaders.forEach(h => colTotals.exp[h] = 0);

        for (let platKey in reportMap) {
            const data = reportMap[platKey];
            
            // Sembunyikan baris jika tidak ada transaksi sama sekali
            if (data.totalIn === 0 && data.totalOut === 0) continue;

            const netProfit = data.totalIn - data.totalOut;
            const rowClass = (platKey === "nonunit") ? "row-nonunit" : "";

            let trBody = `<tr class="${rowClass}">
                <td>${data.platAsli}</td>
                <td>${data.tipe}</td>
                <td class="text-right fw-bold text-success">${rp(data.totalIn)}</td>`;

            incHeaders.forEach(h => {
                trBody += `<td class="text-right">${rp(data.incomes[h])}</td>`;
                colTotals.in[h] += data.incomes[h];
            });

            trBody += `<td class="text-right fw-bold text-danger">${rp(data.totalOut)}</td>`;

            expHeaders.forEach(h => {
                trBody += `<td class="text-right">${rp(data.expenses[h])}</td>`;
                colTotals.exp[h] += data.expenses[h];
            });

            const netColor = netProfit >= 0 ? "text-success" : "text-danger";
            trBody += `<td class="text-right fw-bold ${netColor}">${rp(netProfit)}</td></tr>`;
            
            tbody.innerHTML += trBody;
        }

        // --- RENDER TOTAL BAWAH (FOOTER) ---
        let trFoot = `<tr class="row-total">
            <td colspan="2" class="text-center">TOTAL KESELURUHAN</td>
            <td class="text-right text-success">${rp(grandTotalMasuk)}</td>`;
            
        incHeaders.forEach(h => { trFoot += `<td class="text-right">${rp(colTotals.in[h])}</td>`; });
        
        trFoot += `<td class="text-right text-danger">${rp(grandTotalKeluar)}</td>`;
        
        expHeaders.forEach(h => { trFoot += `<td class="text-right">${rp(colTotals.exp[h])}</td>`; });
        
        const grandNet = grandTotalMasuk - grandTotalKeluar;
        trFoot += `<td class="text-right ${grandNet >= 0 ? 'text-success' : 'text-danger'}">${rp(grandNet)}</td></tr>`;
        
        tfoot.innerHTML = trFoot;
    }

    // 🌟 EKSPOR EXCEL (OTOMATIS MENGCOPY TABEL PIVOT)
    function exportToExcel() {
        const startVal = startDateInput.value;
        const endVal = endDateInput.value;
        const filename = `Laporan_Pivot_${clientToken.toUpperCase()}_${startVal}_to_${endVal}.xls`;

        let htmlTable = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><meta charset="utf-8"></head>
            <body>
                <h2>AMS PRO - LAPORAN KONSOLIDASI AKUNTANSI (${clientToken.toUpperCase()})</h2>
                <p>Periode: ${startVal} s/d ${endVal}</p>
                <br>
                ${document.getElementById('excelPivotTable').outerHTML}
            </body>
            </html>
        `;

        const blob = new Blob([htmlTable], { type: 'application/vnd.ms-excel' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
